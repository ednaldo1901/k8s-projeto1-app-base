apiVersion: v1
kind: Service
metadata:
  name: mysql-local
spec:
  selector:
    app: mysql-local
  ports:
    - protocol: TCP
      port: 3306
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
  type: LoadBalancer

  