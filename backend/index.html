<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css.css" media="screen" />
    <title>Formulário</title>
</head>
<body>
    <div id="form-main">
        <div id="form-div">
            <form class="form" id="contact">
                <p class="name">
                    <input name="nome" type="text" class="feedback-input" placeholder="Nome" id="name" required />
                </p>

                <p class="email">
                    <input name="email" type="email" class="feedback-input" placeholder="Email" id="email" required />
                </p>

                <p class="text">
                    <textarea name="mensagem" class="feedback-input" id="comment" placeholder="Comentário" required></textarea>
                </p>

                <div class="submit">
                    <button type="button" value="SEND" id="button-blue">Enviar</button>
                    <div class="ease"></div>
                </div>
            </form>
        </div>
    </div>

    <div id="form-main" style="margin-top: 500px;">
        <div id="form-div">
            <h2 style="color: white;">Mensagens cadastradas</h2>
            <table style="width: 100%; color: white; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 1px solid white;">
                        <th style="text-align:left;">ID</th>
                        <th style="text-align:left;">Nome</th>
                        <th style="text-align:left;">Email</th>
                        <th style="text-align:left;">Mensagem</th>
                    </tr>
                </thead>
                <tbody id="lista-mensagens">
                    <!-- preenchido via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js.js"></script>
</body>
</html>
